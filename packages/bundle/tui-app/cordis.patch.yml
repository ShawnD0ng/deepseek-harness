# The dsh-tui-app bundle patch: the interactive terminal surface over
# dsh-base. It mounts no Host, HTTP server, Web runtime, or browser plugin.
# An ordinary provider plugin injects `cmdlineArgs`, parses the optional
# initial prompt positional (`dsh tui "<prompt>"`) and this app's --help,
# then the TUI driver creates one Agent through the core registry and runs a
# full-screen terminal interface: streamed transcript, prompt input, and
# in-line ask-user and approval prompts.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui-app/startup'

    # The interactive terminal driver; reads the invocation (initial prompt,
    # resume intent, list) from the ordinary tuiStartup provider.
    - id: tui-runner
      name: '@deepseek-ai/dsh-tui-app'
      inject: [tuiStartup]
      config:
        initialPrompt: !!js ctx.tuiStartup.initialPrompt
        resumeId: !!js ctx.tuiStartup.resumeId
        resumeSelect: !!js ctx.tuiStartup.resumeSelect
        list: !!js ctx.tuiStartup.list
